<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.json"><title>Profit Calculator</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;padding:24px 14px}.box{max-width:480px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:20px;padding:22px}h2{margin:0 0 5px}.sub{color:#777;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:bold;margin-bottom:7px}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:20px}.result{margin-top:18px;padding:20px;border-radius:16px;background:#f7f7f7;text-align:center;border:1px solid #ddd}.value{font-size:38px;font-weight:800;margin:5px}.profit{color:#16803c}.loss{color:#c62828}.percent,.status{color:#777}button{width:100%;margin-top:14px;padding:13px;border:1px solid #ccc;border-radius:12px;background:#fff;font-size:16px;font-weight:bold}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style></head><body><div class="box"><h2>💰 Profit / Loss Calculator</h2><div class="sub">ဝယ်ဈေးနဲ့ ရောင်းဈေးထည့်ပါ</div><div class="grid"><div><label>ဝယ်ဈေး (Cost)</label><input id="buy" type="number" inputmode="decimal" min="0" step="any" value="10"></div><div><label>ရောင်းဈေး (Sell)</label><input id="sell" type="number" inputmode="decimal" step="any" value="15"></div></div><div class="result"><div class="status" id="status">အမြတ် 💰</div><div class="value profit" id="result">+5</div><div class="percent" id="percent">50% အမြတ်</div></div><button id="reset">Reset</button></div><script>const b=document.getElementById('buy'),s=document.getElementById('sell'),r=document.getElementById('result'),st=document.getElementById('status'),p=document.getElementById('percent');function f(n){return n.toLocaleString(undefined,{maximumFractionDigits:2})}function calc(){let x=Math.max(0,Number(b.value)||0),y=Number(s.value)||0,d=y-x;r.className='value '+(d>0?'profit':d<0?'loss':'');r.textContent=(d>0?'+':'')+f(d);st.textContent=d>0?'အမြတ် 💰':d<0?'အရှုံး 📉':'အမြတ်/အရှုံး မရှိ';p.textContent=x?f(Math.abs(d)/x*100)+'% '+(d>0?'အမြတ်':d<0?'အရှုံး':''):'—'}b.addEventListener('input',calc);s.addEventListener('input',calc);document.getElementById('reset').onclick=()=>{b.value=10;s.value=15;calc()};calc();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
